name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push image to registry"
        type: boolean
        default: true

      base_alpine_version:
        description: "Home Assistant Base Images verzió (üres = legfrissebb stable)"
        required: false
        default: "2026.06.1"

      test_build:
        description: "Teszt üzemmód (csak az első néhány sor feldolgozása)"
        required: false
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  REGISTRY_PREFIX: ghcr.io/${{ github.repository_owner }}

  ALPINE_LATEST: "3.24"
  DEBIAN_LATEST: "trixie"
  UBUNTU_LATEST: "26.04"
  PYTHON_LATEST: "3.14"

jobs:

  build:
    name: Build ${{ matrix.architecture }}

    strategy:
      max-parallel: 1
      fail-fast: true

      matrix:
        include:
          - architecture: armv7
            platform: linux/arm/v7

          - architecture: armhf
            platform: linux/arm/v6

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request' && inputs.push
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile

          # A matrix miatt itt már csak EGY architektúra van
          platforms: ${{ matrix.platform }}

          push: ${{ inputs.push }}

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

          provenance: true
          sbom: true

          build-args: |
            BUILDKIT_INLINE_CACHE=1
            BASE_ALPINE_VERSION=${{ inputs.base_alpine_version }}
            TEST_BUILD=${{ inputs.test_build }}

      - name: Image summary
        if: always()
        run: |
          echo "### Docker Image - ${{ matrix.architecture }} :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "**Architecture:** \`${{ matrix.architecture }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** \`${{ matrix.platform }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

          date >> $GITHUB_STEP_SUMMARY
